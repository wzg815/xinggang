<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f7fe0">
<title>小狐狸星星岛 · Foxy's English Adventure</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#7dbcf2;color:#3a2a1a;font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button{font-family:inherit;border:none;outline:none;cursor:pointer;color:inherit;background:none}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.scr{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.shade{background:radial-gradient(ellipse at center,rgba(20,30,70,.15),rgba(20,30,70,.55))}
.card{background:rgba(255,252,246,.94);border-radius:28px;box-shadow:0 12px 40px rgba(30,40,90,.35),inset 0 -6px 0 rgba(0,0,0,.06);padding:22px 26px;max-width:94vw;max-height:94vh;overflow:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;font-size:22px;font-weight:800;color:#fff;background:linear-gradient(180deg,#ffb347,#ff8a1f);box-shadow:0 6px 0 #d96a10,0 10px 20px rgba(0,0,0,.2);transition:transform .08s;letter-spacing:.06em;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d96a10}
.btn.blue{background:linear-gradient(180deg,#5ec8ff,#2b8fe8);box-shadow:0 6px 0 #1d6fc0,0 10px 20px rgba(0,0,0,.2)}
.btn.green{background:linear-gradient(180deg,#7be38a,#34b85a);box-shadow:0 6px 0 #22904a,0 10px 20px rgba(0,0,0,.2)}
.btn.white{background:#fff;color:#4a3a2a;box-shadow:0 6px 0 #d8d0c4,0 10px 20px rgba(0,0,0,.15)}
.btn.small{font-size:17px;padding:10px 18px}
.btn .emo{font-size:1.15em}
/* boot */
#boot{background:linear-gradient(180deg,#5aa8f0,#a9dcff);z-index:60;color:#fff}
#boot .fox{font-size:74px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
#boot .t{font-size:30px;font-weight:900;margin-top:8px;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.bar{width:min(380px,70vw);height:16px;border-radius:10px;background:rgba(255,255,255,.35);overflow:hidden;margin-top:18px}
#boot-fill{height:100%;width:0;background:linear-gradient(90deg,#ffd34f,#ff9a2e);border-radius:10px;transition:width .25s}
/* title */
#title{justify-content:flex-start;padding-top:max(4vh,env(safe-area-inset-top));background:linear-gradient(180deg,rgba(255,255,255,0) 50%,rgba(20,40,90,.25))}
.logo{font-size:clamp(40px,8vw,84px);font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:0 5px 0 #ff8a1f,0 9px 0 rgba(160,70,0,.45),0 14px 30px rgba(0,0,0,.25);text-align:center;margin-top:2vh}
.logo-en{font-size:clamp(15px,2.3vw,24px);font-weight:800;color:#fff7d6;letter-spacing:.12em;text-shadow:0 2px 6px rgba(0,0,0,.35);margin-top:6px}
.tbtns{position:absolute;bottom:max(6vh,calc(18px + env(safe-area-inset-bottom)));display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.grade{display:flex;background:rgba(255,255,255,.85);border-radius:999px;padding:5px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.grade button{padding:9px 16px;border-radius:999px;font-size:17px;font-weight:800;color:#7a6a5a}
.grade button.on{background:#ff9a2e;color:#fff;box-shadow:0 3px 0 #d96a10}
#t-grade{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right))}
/* select */
#select{background:linear-gradient(180deg,rgba(30,60,140,.25),rgba(30,40,90,.5))}
#select h2,.h2{font-size:30px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2);margin-bottom:14px}
.lvls{display:flex;gap:16px;padding:6px 16px;max-width:100vw;overflow-x:auto}
.lv{position:relative;width:min(205px,22vw);min-width:160px;border-radius:26px;padding:14px 12px 14px;color:#fff;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.18),0 14px 26px rgba(0,0,0,.25);transition:transform .1s;flex-shrink:0}
.lv:active{transform:scale(.96)}
.lv .ic{font-size:58px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.lv .n{font-size:24px;font-weight:900;margin-top:4px;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.lv .e{font-size:13px;font-weight:700;opacity:.9}
.lv .d{font-size:14px;margin-top:4px;background:rgba(255,255,255,.25);border-radius:999px;padding:3px 8px;display:inline-block}
.lv .s{margin-top:8px;font-size:16px;font-weight:800;display:flex;justify-content:center;gap:8px}
.lv .g{font-size:20px;letter-spacing:2px}
.lv.lock{filter:grayscale(.75) brightness(.85)}
.lv .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;background:rgba(0,0,0,.25);border-radius:26px}
.lv .num{position:absolute;left:10px;top:8px;width:34px;height:34px;border-radius:50%;background:#fff;color:#ff8a1f;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center}
.lv.done:after{content:"✔";position:absolute;right:10px;top:8px;width:30px;height:30px;border-radius:50%;background:#34b85a;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:14px;margin-top:18px;align-items:center;flex-wrap:wrap;justify-content:center}
/* hud */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.pills{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;gap:10px;flex-wrap:wrap;max-width:60vw}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.88);border-radius:999px;padding:5px 14px 5px 8px;font-size:22px;font-weight:900;color:#4a3a2a;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.pill .emo{font-size:26px}
.pill.gems{gap:2px;padding:5px 10px}
.gs{width:22px;height:22px;border-radius:6px;transform:rotate(45deg);margin:0 5px;background:rgba(0,0,0,.12);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.gs.on{box-shadow:0 0 10px currentColor;background:currentColor}
#b-pause{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 4px 12px rgba(0,0,0,.18);pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:6px}
#b-pause i{width:7px;height:22px;border-radius:3px;background:#ff8a1f}
#hint{position:absolute;left:50%;top:max(80px,calc(70px + env(safe-area-inset-top)));transform:translateX(-50%);background:rgba(255,255,255,.93);border-radius:22px;padding:10px 20px;font-size:21px;font-weight:800;color:#4a3a2a;box-shadow:0 6px 18px rgba(0,0,0,.2);display:flex;align-items:center;gap:10px;transition:opacity .35s,transform .35s;white-space:nowrap;max-width:80vw}
#hint .emo{font-size:30px}
#hint.off{opacity:0;transform:translate(-50%,-10px)}
#wcard{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(80px,calc(76px + env(safe-area-inset-top)));width:200px;background:rgba(255,255,255,.95);border-radius:24px;padding:12px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:auto;transition:opacity .3s,transform .3s}
#wcard.off{opacity:0;transform:translateX(30px);pointer-events:none}
#wcard .pic{font-size:72px;height:84px;display:flex;align-items:center;justify-content:center}
#wcard .en{font-size:34px;font-weight:900;color:#2b5fd8;font-family:"Arial Rounded MT Bold","Nunito","Varela Round",system-ui,sans-serif}
#wcard .zh{font-size:20px;font-weight:800;color:#7a6a5a}
#wcard .new{position:absolute;left:-8px;top:-8px;background:#ff5a7a;color:#fff;font-size:14px;font-weight:900;padding:4px 10px;border-radius:999px;transform:rotate(-8deg)}
.spk{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:#ffefd6;font-size:24px;margin-top:4px}
.paint{display:inline-block;width:1em;height:1em;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;background:var(--c);box-shadow:inset -.08em -.1em 0 rgba(0,0,0,.15),inset .08em .08em 0 rgba(255,255,255,.35)}
.num{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.num b{font-size:.75em;font-weight:900;color:#2b6fd8;font-family:"Arial Rounded MT Bold",system-ui,sans-serif}
.num i{display:flex;flex-wrap:wrap;justify-content:center;width:1.2em;gap:.04em;margin-top:.05em}
.num s{display:block;width:.17em;height:.17em;border-radius:50%;background:#ffbf1f;text-decoration:none}
/* touch */
#touch{position:fixed;inset:0;z-index:12;pointer-events:none}
#joy{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,.32));box-shadow:inset 0 0 0 3px rgba(255,255,255,.7),0 4px 14px rgba(0,0,0,.15);opacity:.55;transition:opacity .15s}
#joy.on{opacity:1}
#joy i{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd7a8);box-shadow:0 4px 10px rgba(0,0,0,.25)}
#joy b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:rgba(255,255,255,.95);font-weight:900;letter-spacing:.1em;padding-top:112px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#jump{position:absolute;right:calc(28px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;pointer-events:auto;background:radial-gradient(circle at 40% 30%,#ffd27a,#ff8a1f);box-shadow:0 8px 0 #c95f0d,0 12px 24px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:900}
#jump svg{width:52px;height:52px}
#jump.on{transform:translateY(5px);box-shadow:0 3px 0 #c95f0d}
/* quiz */
#quiz{z-index:30;background:rgba(20,30,70,.45)}
.qcard{background:rgba(255,252,246,.97);border-radius:30px;padding:16px 22px 20px;box-shadow:0 14px 40px rgba(0,0,0,.35);text-align:center;max-width:96vw}
.qtop{display:flex;align-items:center;justify-content:center;gap:12px}
.qowl{font-size:50px}
.qp{font-size:26px;font-weight:900;color:#4a3a2a}
.qsay{width:64px;height:64px;border-radius:50%;background:linear-gradient(180deg,#5ec8ff,#2b8fe8);box-shadow:0 5px 0 #1d6fc0;font-size:30px;display:inline-flex;align-items:center;justify-content:center}
.qw{font-size:42px;font-weight:900;color:#2b5fd8;letter-spacing:.12em;margin:4px 0;font-family:"Arial Rounded MT Bold",system-ui,sans-serif}
.qpic{font-size:86px;line-height:1.05}
.qopts{display:flex;gap:16px;justify-content:center;margin-top:12px}
.qo{width:min(170px,26vw);height:min(170px,38vh);border-radius:26px;background:#fff;box-shadow:0 7px 0 #e2d8c8,0 10px 20px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:min(92px,17vh);transition:transform .1s}
.qo.txt{font-size:min(36px,8vh);font-weight:900;color:#2b5fd8;font-family:"Arial Rounded MT Bold",system-ui,sans-serif}
.qo:active{transform:scale(.95)}
.qo.ok{background:#b9f5c4;box-shadow:0 7px 0 #34b85a}
.qo.bad{opacity:.35;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.qdots{display:flex;gap:10px;justify-content:center;margin-top:12px}
.qdots i{width:18px;height:18px;border-radius:50%;background:#e2d8c8}
.qdots i.on{background:#ffbf1f;box-shadow:0 0 8px #ffbf1f}
.qmsg{font-size:24px;font-weight:900;height:30px;margin-top:6px;color:#34b85a}
/* done */
#done .card{text-align:center;min-width:min(460px,92vw)}
.big{font-size:52px;font-weight:900;color:#ff8a1f;text-shadow:0 4px 0 #ffe0b8}
.res{display:flex;gap:14px;justify-content:center;margin:14px 0 6px;flex-wrap:wrap}
.res div{background:#fff3e0;border-radius:20px;padding:10px 16px;font-size:22px;font-weight:900;min-width:110px}
.res div small{display:block;font-size:14px;color:#8a7a6a;font-weight:700}
/* book */
#book .card{width:min(860px,96vw);height:min(560px,92vh);display:flex;flex-direction:column}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.tabs button{padding:8px 14px;border-radius:999px;background:#f1e8da;font-size:17px;font-weight:800}
.tabs button.on{background:#ff9a2e;color:#fff}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;padding:4px}
.wt{background:#fff;border-radius:18px;box-shadow:0 4px 0 #e8dfd2;padding:8px 4px;text-align:center}
.wt .p{font-size:46px;height:56px;display:flex;align-items:center;justify-content:center}
.wt .e{font-size:20px;font-weight:900;color:#2b5fd8;font-family:"Arial Rounded MT Bold",system-ui,sans-serif}
.wt .z{font-size:14px;color:#8a7a6a;font-weight:700}
.wt.lk{opacity:.45}.wt.lk .p{filter:grayscale(1) brightness(1.4)}
/* settings / pause */
.set{display:flex;flex-direction:column;gap:14px;min-width:min(420px,90vw)}
.set .r{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:20px;font-weight:800}
.seg{display:flex;background:#f1e8da;border-radius:999px;padding:4px}
.seg button{padding:7px 14px;border-radius:999px;font-size:16px;font-weight:800;color:#7a6a5a}
.seg button.on{background:#ff9a2e;color:#fff}
input[type=range]{width:170px;accent-color:#ff8a1f}
#intro{z-index:25;pointer-events:none}
#intro .c{background:rgba(255,255,255,.9);border-radius:30px;padding:16px 34px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .5s ease-out}
#intro .c .emo{font-size:60px}
#intro .c b{display:block;font-size:40px;font-weight:900;color:#ff8a1f}
#intro .c span{font-size:18px;font-weight:800;color:#7a6a5a}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
#rotate{position:fixed;inset:0;z-index:90;background:linear-gradient(180deg,#5aa8f0,#a9dcff);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:900;text-align:center;gap:14px}
#rotate .ph{width:64px;height:100px;border:6px solid #fff;border-radius:14px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#fatal{position:fixed;inset:0;z-index:99;background:#5aa8f0;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px;line-height:1.8}
#loading{z-index:40;background:rgba(90,168,240,.9);color:#fff;font-size:28px;font-weight:900}
@media (max-height:500px){
  .logo{font-size:46px;margin-top:0}.logo-en{font-size:14px}.btn{font-size:18px;padding:10px 20px}.btn.small{font-size:15px;padding:8px 14px}
  .lv{min-width:140px;padding:10px 8px}.lv .ic{font-size:44px}.lv .n{font-size:20px}#select h2,.h2{font-size:22px;margin-bottom:8px}.row{margin-top:10px}
  .pill{font-size:18px;padding:3px 12px 3px 6px}.pill .emo{font-size:21px}#b-pause{width:48px;height:48px}
  #hint{font-size:17px;padding:7px 14px;top:calc(60px + env(safe-area-inset-top))}#hint .emo{font-size:24px}
  #wcard{width:160px;padding:8px;top:calc(62px + env(safe-area-inset-top))}#wcard .pic{font-size:52px;height:60px}#wcard .en{font-size:26px}#wcard .zh{font-size:16px}.spk{width:38px;height:38px;font-size:20px}
  #jump{width:108px;height:108px}#joy{width:130px;height:130px;margin:-65px 0 0 -65px}#joy b{padding-top:98px}
  .qcard{padding:10px 16px 12px}.qowl{font-size:38px}.qp{font-size:20px}.qsay{width:52px;height:52px;font-size:24px}.qpic{font-size:56px}.qw{font-size:30px}.qmsg{font-size:18px;height:22px;margin-top:2px}.qdots{margin-top:6px}
  .big{font-size:38px}.res div{font-size:18px;padding:6px 12px;min-width:90px}.card{padding:14px 18px}
}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="boot" class="scr"><div class="fox emo">🦊</div><div class="t">小狐狸星星岛</div><div class="bar"><div id="boot-fill"></div></div></div>

<div id="title" class="scr hide">
  <div class="logo">小狐狸星星岛</div>
  <div class="logo-en">FOXY'S ENGLISH ADVENTURE</div>
  <div id="t-grade" class="grade"><button data-g="1">一年级</button><button data-g="3">三年级</button></div>
  <div class="tbtns">
    <button class="btn" id="b-play" style="font-size:28px;padding:16px 40px"><span class="emo">▶️</span>开始冒险</button>
    <button class="btn blue" id="b-book"><span class="emo">📖</span>单词本</button>
    <button class="btn white small" id="b-set"><span class="emo">⚙️</span>设置</button>
  </div>
</div>

<div id="select" class="scr hide">
  <h2>选一个岛屿</h2>
  <div class="lvls" id="lvls"></div>
  <div class="row"><button class="btn white small" id="s-back"><span class="emo">⬅️</span>返回</button><button class="btn blue small" id="s-book"><span class="emo">📖</span>单词本</button></div>
</div>

<div id="hud" class="hide">
  <div class="pills"><div class="pill"><span class="emo">⭐</span><span id="h-star">0</span></div><div class="pill"><span class="emo">📖</span><span id="h-word">0/18</span></div><div class="pill gems" id="h-gems"><i class="gs" style="color:#ff3d6e"></i><i class="gs" style="color:#37b6ff"></i><i class="gs" style="color:#a75cff"></i></div></div>
  <button id="b-pause" aria-label="暂停"><i></i><i></i></button>
  <div id="hint" class="off"></div>
  <div id="wcard" class="off"><div class="new">NEW</div><div class="pic" id="wc-pic"></div><div class="en" id="wc-en"></div><div class="zh" id="wc-zh"></div><button class="spk" id="wc-say">🔊</button></div>
</div>
<div id="touch" class="hide"><div id="joy"><i></i><b>移动</b></div><div id="jump"><svg viewBox="0 0 24 24"><path d="M12 4l7 8h-4.5v7h-5v-7H5z" fill="#fff"/></svg>跳</div></div>

<div id="intro" class="scr hide"><div class="c"><div class="emo" id="in-ic"></div><b id="in-n"></b><span id="in-d"></span></div></div>

<div id="quiz" class="scr hide"><div class="qcard">
  <div class="qtop"><span class="qowl emo">🦉</span><span class="qp" id="q-p"></span><button class="qsay" id="q-say">🔊</button></div>
  <div id="q-mid"></div>
  <div class="qopts" id="q-opts"></div>
  <div class="qmsg" id="q-msg"></div>
  <div class="qdots" id="q-dots"></div>
</div></div>

<div id="pause" class="scr shade hide"><div class="card" style="text-align:center">
  <div class="h2" style="color:#ff8a1f;text-shadow:none">休息一下</div>
  <div style="display:flex;flex-direction:column;gap:14px;align-items:center">
    <button class="btn green" id="p-go"><span class="emo">▶️</span>继续玩</button>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><button class="btn small" id="p-re"><span class="emo">🔄</span>重新开始</button><button class="btn blue small" id="p-sel"><span class="emo">🗺️</span>选岛屿</button><button class="btn white small" id="p-set"><span class="emo">⚙️</span>设置</button></div>
  </div>
</div></div>

<div id="done" class="scr shade hide"><div class="card">
  <div class="emo" style="font-size:56px">🏆</div>
  <div class="big">太棒了！</div>
